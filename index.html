<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cek Risiko Diabetes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0F7F7;--card:#fff;--ink:#0D2B2E;--mut:#5A7578;--line:#D2E3E4;--seg:#E4F0F0;--pri:#0F766E;--on:#fff;--hd:#0B5E63;--low:#1E8E5A;--high:#D13B3B;--lowbg:#E3F5EB;--highbg:#FCE9E9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1819;--card:#112326;--ink:#E6F2F2;--mut:#94B0B3;--line:#1F3A3E;--seg:#1A3236;--pri:#2BB5AA;--on:#062022;--low:#4CC38A;--high:#FF7272;--lowbg:#12301F;--highbg:#3A1A1C}}
:root[data-theme="dark"]{--bg:#0A1819;--card:#112326;--ink:#E6F2F2;--mut:#94B0B3;--line:#1F3A3E;--seg:#1A3236;--pri:#2BB5AA;--on:#062022;--low:#4CC38A;--high:#FF7272;--lowbg:#12301F;--highbg:#3A1A1C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
.hd{background:var(--hd);color:#fff;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.2rem;font-weight:700;margin:0}
.tabs{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.tab{border:0;background:transparent;color:#fff;padding:7px 16px;border-radius:999px;font:inherit;font-weight:500;display:flex;gap:8px;align-items:center;cursor:pointer}
.tab b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.28);font-size:.78rem}
.tab.on{background:#fff;color:var(--hd);font-weight:700}
.tab.on b{background:var(--hd);color:#fff}
.tab:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:560px){.tabs{width:100%}.tab{flex:1;justify-content:center}}
.app{max-width:760px;margin:0 auto;padding:20px 14px 48px}
.vp{overflow:hidden;transition:height .3s ease}
.tr{display:flex;width:200%;align-items:flex-start;transition:transform .35s ease}
.sl{flex:0 0 50%;min-width:0;padding:4px}
@media(prefers-reduced-motion:reduce){.tr,.vp{transition:none}}
h2{font-size:1.3rem;font-weight:800;margin:0 0 16px;outline:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:420px){.g2{grid-template-columns:1fr}}
label,.lb{display:block;font-size:.9rem;font-weight:500;color:var(--mut);margin-bottom:6px}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding-right:10px}
.in:focus-within{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.in input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:10px;outline:0}
.in span{font-size:.8rem;color:var(--mut)}
.fl{margin-bottom:18px}
.seg{display:flex;gap:4px;background:var(--seg);padding:4px;border-radius:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:8px 4px;border-radius:7px;font:inherit;font-weight:500;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--on);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:.95rem;cursor:pointer;margin:0}
.chk input{width:18px;height:18px;accent-color:var(--pri)}
.go,.alt{margin-top:22px;width:100%;padding:13px;border-radius:10px;font:inherit;font-size:1.05rem;font-weight:800;cursor:pointer}
.go{border:0;background:var(--pri);color:var(--on)}
.alt{margin-top:16px;border:2px solid var(--pri);background:transparent;color:var(--pri)}
.seg button:focus-visible,.go:focus-visible,.alt:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.err{color:var(--high);font-size:.9rem;margin:10px 0 0}
.rs{border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--card)}
.rs.lo{background:var(--lowbg);border-color:var(--low)}
.rs.hi{background:var(--highbg);border-color:var(--high)}
.st{display:flex;align-items:center;gap:14px}
.st svg{flex:none}
.kt{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;line-height:1.1}
.ks{color:var(--mut)}
.vb{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:20px 0 8px;gap:2px}
.vb span{display:flex;align-items:center;justify-content:center;color:var(--on);font-weight:800}
.vb .lo{background:var(--low)}.vb .hi{background:var(--high)}
.vl{display:flex;justify-content:space-between;font-size:.88rem;color:var(--mut);margin-bottom:16px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.dot.lo{background:var(--low)}.dot.hi{background:var(--high)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.85rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 14px 8px 0;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500}
tr.far{opacity:.4}
</style>
</head>
<body>
<header class="hd">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#fff"/><path d="M14 8h6v6h6v6h-6v6h-6v-6H8v-6h6z" fill="#0B5E63"/></svg>
    <h1>Cek Risiko Diabetes</h1>
  </div>
  <nav class="tabs" aria-label="Langkah">
    <button type="button" class="tab on" id="t0"><b>1</b>Data</button>
    <button type="button" class="tab" id="t1"><b>2</b>Hasil</button>
  </nav>
</header>

<main class="app">
  <div class="vp" id="vp"><div class="tr" id="tr">
    <section class="sl" id="s0">
      <h2 tabindex="-1">Data pasien</h2>
      <div class="card">
        <div class="g2">
          <div><label for="usia">Usia</label><div class="in"><input id="usia" type="number" inputmode="numeric" min="1" max="120" value="42"><span>th</span></div></div>
          <div><label for="bmi">BMI</label><div class="in"><input id="bmi" type="number" inputmode="decimal" min="10" max="60" step="0.1" value="28.5"><span>kg/m²</span></div></div>
          <div><label for="glukosa">Glukosa</label><div class="in"><input id="glukosa" type="number" inputmode="numeric" min="50" max="400" value="130"><span>mg/dL</span></div></div>
          <div><label for="tekanan">Tekanan darah</label><div class="in"><input id="tekanan" type="number" inputmode="numeric" min="60" max="220" value="128"><span>mmHg</span></div></div>
        </div>
        <div class="fl"><span class="lb">Riwayat diabetes keluarga</span><div class="seg" id="riw" role="group" aria-label="Riwayat diabetes keluarga"></div></div>
        <div class="fl"><span class="lb">Jumlah tetangga (K)</span><div class="seg" id="kk" role="group" aria-label="Jumlah tetangga"></div></div>
        <label class="chk"><input id="norm" type="checkbox">Normalisasi data</label>
        <button id="go" class="go" type="button">Prediksi</button>
        <p id="err" class="err" role="alert"></p>
      </div>
    </section>
    <section class="sl" id="s1" aria-live="polite">
      <h2 tabindex="-1">Hasil prediksi</h2>
      <div id="rs" class="rs"></div>
      <button id="back" class="alt" type="button">Ubah data</button>
    </section>
  </div></div>
</main>

<script>
const DATA=[["P01",25,21.5,90,110,0,0],["P02",30,23.1,95,115,0,0],["P03",35,25.0,105,120,0,0],["P04",40,27.5,120,125,1,1],["P05",45,30.2,140,135,1,1],["P06",50,31.5,155,140,1,1],["P07",55,33.0,165,145,1,1],["P08",28,22.5,92,112,0,0],["P09",38,26.8,115,122,0,0],["P10",48,29.5,145,130,1,1]];
const LBL=["Rendah","Tinggi"], CLS=["lo","hi"], IDS=["usia","bmi","glukosa","tekanan"];
const $=id=>document.getElementById(id);
const S={riw:1,k:3,norm:false};
const vp=$("vp"), tr=$("tr"), sl=[$("s0"),$("s1")];
let cur=0;

const fit=()=>{vp.style.height=sl[cur].offsetHeight+"px"};
const ro=new ResizeObserver(fit); sl.forEach(s=>ro.observe(s));
function show(n,focus=true){
  cur=n;
  tr.style.transform=`translateX(${-50*n}%)`;
  sl.forEach((s,i)=>s.inert=i!==n);
  [0,1].forEach(i=>{$("t"+i).classList.toggle("on",i===n);$("t"+i).setAttribute("aria-current",i===n?"step":"false")});
  fit();
  if(focus){window.scrollTo(0,0);sl[n].querySelector("h2").focus({preventScroll:true});}
}

function seg(el,opts,key){
  el.innerHTML=opts.map(([v,t])=>`<button type="button" data-v="${v}">${t}</button>`).join("");
  const mark=()=>[...el.children].forEach(b=>{const on=+b.dataset.v===S[key];b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;S[key]=+b.dataset.v;mark();};
  mark();
}
seg($("riw"),[[1,"Ada"],[0,"Tidak ada"]],"riw");
seg($("kk"),[1,3,5,7,9].map(n=>[n,n]),"k");
$("norm").onchange=e=>{S.norm=e.target.checked;};

const ICON=[
 '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--low)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-7"/></svg>',
 '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--high)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.5"/></svg>'
];

function draw(P){
  const k=P.k, baru=[P.usia,P.bmi,P.glukosa,P.tekanan,P.riw], X=DATA.map(r=>r.slice(1,6)), J=[0,1,2,3,4];
  const lo=J.map(j=>Math.min(...X.map(r=>r[j]))), hi=J.map(j=>Math.max(...X.map(r=>r[j])));
  const sc=(v,j)=>P.norm?(v-lo[j])/(hi[j]-lo[j]):v;
  const rows=DATA.map((r,i)=>({r,d:Math.hypot(...J.map(j=>sc(X[i][j],j)-sc(baru[j],j)))})).sort((a,b)=>a.d-b.d);
  const nn=rows.slice(0,k), tinggi=nn.filter(x=>x.r[6]).length, rendah=k-tinggi;
  const pred=tinggi>rendah?1:0, menang=pred?tinggi:rendah;
  const chips=[`${P.usia} th`,`BMI ${P.bmi}`,`${P.glukosa} mg/dL`,`${P.tekanan} mmHg`,`Riwayat ${P.riw?"ada":"tidak ada"}`,`K = ${k}`].concat(P.norm?["Normalisasi"]:[]);

  $("rs").className="rs "+CLS[pred];
  $("rs").innerHTML=
    `<div class="st">${ICON[pred]}<div><div class="kt">Risiko ${LBL[pred]}</div><div class="ks">${menang} dari ${k} tetangga terdekat</div></div></div>`+
    `<div class="vb">${rendah?`<span class="lo" style="flex:${rendah}">${rendah}</span>`:""}${tinggi?`<span class="hi" style="flex:${tinggi}">${tinggi}</span>`:""}</div>`+
    `<div class="vl"><span><i class="dot lo"></i>Rendah</span><span><i class="dot hi"></i>Tinggi</span></div>`+
    `<div class="chips">${chips.map(c=>`<span>${c}</span>`).join("")}</div>`+
    `<div class="tw"><table><tr><th>Pasien</th><th>Usia</th><th>BMI</th><th>Glukosa</th><th>Tek. darah</th><th>Riwayat</th><th>Jarak</th></tr>`+
    rows.map((x,i)=>`<tr class="${i<k?"":"far"}"><td><i class="dot ${CLS[x.r[6]]}"></i>${x.r[0]}</td><td>${x.r[1]}</td><td>${x.r[2]}</td><td>${x.r[3]}</td><td>${x.r[4]}</td><td>${x.r[5]?"Ada":"Tidak"}</td><td>${x.d.toFixed(3)}</td></tr>`).join("")+
    `</table></div>`;
}

function predict(){
  if(IDS.some(id=>$(id).value===""||isNaN(+$(id).value))){
    $("err").textContent="Lengkapi semua kolom dengan angka.";show(0);return;
  }
  $("err").textContent="";
  draw({usia:+$("usia").value,bmi:+$("bmi").value,glukosa:+$("glukosa").value,tekanan:+$("tekanan").value,...S});
  show(1);
}
$("go").onclick=predict; $("t1").onclick=predict;
$("t0").onclick=()=>show(0); $("back").onclick=()=>show(0);

let x0=null;
document.addEventListener("touchstart",e=>{x0=e.target.closest(".tw")?null:e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(dx>70&&cur===1)show(0); else if(dx<-70&&cur===0)predict();
},{passive:true});

show(0,false);
</script>
</body>
</html>
